<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" style="background: #FFFFFF;">
    <!-- Grid Canvas Background -->
    <defs>
      <pattern id="grid-sys-01" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(17, 19, 23, 0.06)" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid-sys-01)" />
    
    <!-- Outer Precision Border -->
    <rect x="24" y="24" width="552" height="552" fill="none" stroke="#111317" stroke-width="1.5" />
    
    <!-- Chamfered Accent Corner Notch -->
    <polygon points="576,24 576,48 552,24" fill="#FF4800" />
    
    <!-- Technical Corner Marks -->
    <path d="M 32 44 L 44 44 M 44 32 L 44 44" fill="none" stroke="#111317" stroke-width="1" />
    <path d="M 568 556 L 556 556 M 556 568 L 556 556" fill="none" stroke="#111317" stroke-width="1" />
    <path d="M 32 556 L 44 556 M 44 568 L 44 556" fill="none" stroke="#111317" stroke-width="1" />
    
    <!-- Header Block -->
    <text x="40" y="58" font-family="'Space Mono', 'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#111317" letter-spacing="1.5">[REF-8491-A] SPECIFICATION SCHEMATIC</text>
    <text x="40" y="78" font-family="'Helvetica Neue', Inter, sans-serif" font-size="18" font-weight="800" fill="#111317" letter-spacing="-0.5">SYS-01 // LOREM IPSUM</text>
    <text x="40" y="96" font-family="'Space Mono', 'JetBrains Mono', monospace" font-size="10" fill="#FF4800" letter-spacing="1">● TRL-4 LAB VALIDATED // MODULUS ALPHA</text>
    
    <line x1="40" y1="108" x2="560" y2="108" stroke="rgba(17, 19, 23, 0.15)" stroke-width="1" />
    
    <!-- Central Schematic Diagram (Teenage Engineering Hardware Geometry) -->
    <g transform="translate(300, 310)">
      <!-- Coordinate Crosshairs -->
      <line x1="-220" y1="0" x2="220" y2="0" stroke="rgba(17, 19, 23, 0.2)" stroke-width="1" stroke-dasharray="3,3" />
      <line x1="0" y1="-160" x2="0" y2="160" stroke="rgba(17, 19, 23, 0.2)" stroke-width="1" stroke-dasharray="3,3" />
      
      <!-- Outer Concentric Circles -->
      <circle cx="0" cy="0" r="140" fill="none" stroke="#111317" stroke-width="1.5" />
      <circle cx="0" cy="0" r="120" fill="none" stroke="rgba(17, 19, 23, 0.4)" stroke-width="1" stroke-dasharray="4,4" />
      <circle cx="0" cy="0" r="80" fill="none" stroke="#111317" stroke-width="1" />
      <circle cx="0" cy="0" r="35" fill="rgba(255, 72, 0, 0.08)" stroke="#FF4800" stroke-width="1.5" />
      <circle cx="0" cy="0" r="6" fill="#FF4800" />
      
      <!-- Mechanical Angular Cut Polygon -->
      <polygon points="-90,-50 -50,-90 50,-90 90,-50 90,50 50,90 -50,90 -90,50" fill="none" stroke="#111317" stroke-width="1.5" />
      
      <!-- Caliper Dimensions & Callouts -->
      <line x1="-160" y1="-140" x2="-160" y2="140" stroke="#111317" stroke-width="1" />
      <path d="M -165 -140 L -155 -140 M -165 140 L -155 140" stroke="#111317" stroke-width="1" />
      <text x="-190" y="5" font-family="'Space Mono', monospace" font-size="9" fill="#111317" transform="rotate(-90, -190, 5)">Ø 280.00 mm</text>
      
      <!-- Vectoring Angle Lines -->
      <line x1="0" y1="0" x2="110" y2="0" stroke="#FF4800" stroke-width="2" />
      <circle cx="110" cy="0" r="4" fill="#FF4800" />
      
      <!-- Calibration Scale Marks -->
      <g transform="rotate(0)">
        <line x1="-70" y1="-70" x2="-60" y2="-60" stroke="#111317" stroke-width="1.5" />
        <line x1="70" y1="-70" x2="60" y2="-60" stroke="#111317" stroke-width="1.5" />
        <line x1="70" y1="70" x2="60" y2="60" stroke="#111317" stroke-width="1.5" />
        <line x1="-70" y1="70" x2="-60" y2="60" stroke="#111317" stroke-width="1.5" />
      </g>
    </g>
    
    <!-- Footer Technical Readout Strip -->
    <rect x="40" y="504" width="520" height="44" fill="#F2F3F0" stroke="#111317" stroke-width="1" />
    <text x="54" y="524" font-family="'Space Mono', monospace" font-size="9" fill="rgba(17, 19, 23, 0.6)">CALIBRATION METRIC</text>
    <text x="54" y="540" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#111317">42.8 kV</text>
    
    <text x="240" y="524" font-family="'Space Mono', monospace" font-size="9" fill="rgba(17, 19, 23, 0.6)">ACCURACY / TOL</text>
    <text x="240" y="540" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#111317">±0.0015% F.S.</text>
    
    <text x="420" y="524" font-family="'Space Mono', monospace" font-size="9" fill="rgba(17, 19, 23, 0.6)">CONRAD VERIFICATION</text>
    <text x="420" y="540" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FF4800">[PASSED // STAGE 2]</text>
  </svg>