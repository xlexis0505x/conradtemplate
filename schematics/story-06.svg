<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" style="background: #FFFFFF;">
    <!-- Grid Canvas Background -->
    <defs>
      <pattern id="grid-story-06" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(20, 24, 30, 0.06)" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid-story-06)" />
    
    <!-- Outer Precision Border -->
    <rect x="24" y="24" width="552" height="552" fill="none" stroke="#14181E" stroke-width="1.5" />
    
    <!-- Chamfered Accent Corner Notch -->
    <polygon points="576,24 576,48 552,24" fill="#C85A32" />
    
    <!-- Technical Corner Marks -->
    <path d="M 32 44 L 44 44 M 44 32 L 44 44" fill="none" stroke="#14181E" stroke-width="1" />
    <path d="M 568 556 L 556 556 M 556 568 L 556 556" fill="none" stroke="#14181E" stroke-width="1" />
    <path d="M 32 556 L 44 556 M 44 568 L 44 556" fill="none" stroke="#14181E" stroke-width="1" />
    
    <!-- Header Block (Coalowl Helvetica Neue / Sentence Case) -->
    <text x="42" y="58" font-family="'JetBrains Mono', 'Space Mono', monospace" font-size="10" font-weight="700" fill="#C85A32" letter-spacing="1.5">[CHAPTER 06 &#8226; POWER ELECTRONICS]</text>
    <text x="42" y="82" font-family="'Helvetica neue', 'Noto Sans JP', sans-serif" font-size="20" font-weight="500" fill="#14181E" letter-spacing="-0.3">High-voltage solid-state power stage</text>
    <text x="42" y="101" font-family="'Helvetica neue', 'Noto Sans JP', sans-serif" font-size="11" fill="rgba(20, 24, 30, 0.65)" letter-spacing="0.2">Micro-pulsed GaN switching array at 38kV with 98.4% power efficiency</text>
    
    <line x1="42" y1="114" x2="558" y2="114" stroke="rgba(20, 24, 30, 0.12)" stroke-width="1" />
    
    <!-- Central Schematic Diagram (Teenage Engineering Hardware Geometry) -->
    <g transform="translate(300, 310)">
      <!-- Coordinate Crosshairs -->
      <line x1="-220" y1="0" x2="220" y2="0" stroke="rgba(20, 24, 30, 0.2)" stroke-width="1" stroke-dasharray="3,3" />
      <line x1="0" y1="-160" x2="0" y2="160" stroke="rgba(20, 24, 30, 0.2)" stroke-width="1" stroke-dasharray="3,3" />
      
      <!-- Outer Concentric Circles -->
      <circle cx="0" cy="0" r="140" fill="none" stroke="#14181E" stroke-width="1.5" />
      <circle cx="0" cy="0" r="120" fill="none" stroke="rgba(20, 24, 30, 0.4)" stroke-width="1" stroke-dasharray="4,4" />
      <circle cx="0" cy="0" r="80" fill="none" stroke="#14181E" stroke-width="1" />
      <circle cx="0" cy="0" r="35" fill="rgba(255, 72, 0, 0.08)" stroke="#C85A32" stroke-width="1.5" />
      <circle cx="0" cy="0" r="6" fill="#C85A32" />
      
      <!-- Mechanical Angular Cut Polygon -->
      <polygon points="-90,-50 -50,-90 50,-90 90,-50 90,50 50,90 -50,90 -90,50" fill="none" stroke="#14181E" stroke-width="1.5" />
      
      <!-- Caliper Dimensions & Callouts -->
      <line x1="-160" y1="-140" x2="-160" y2="140" stroke="#14181E" stroke-width="1" />
      <path d="M -165 -140 L -155 -140 M -165 140 L -155 140" stroke="#14181E" stroke-width="1" />
      <text x="-190" y="5" font-family="'Space Mono', monospace" font-size="9" fill="#14181E" transform="rotate(-90, -190, 5)">Ø 280.00 mm</text>
      
      <!-- Vectoring Angle Lines -->
      <line x1="0" y1="0" x2="-110" y2="1.3471114790620885e-14" stroke="#C85A32" stroke-width="2" />
      <circle cx="-110" cy="1.3471114790620885e-14" r="4" fill="#C85A32" />
      
      <!-- Calibration Scale Marks -->
      <g transform="rotate(75)">
        <line x1="-70" y1="-70" x2="-60" y2="-60" stroke="#14181E" stroke-width="1.5" />
        <line x1="70" y1="-70" x2="60" y2="-60" stroke="#14181E" stroke-width="1.5" />
        <line x1="70" y1="70" x2="60" y2="60" stroke="#14181E" stroke-width="1.5" />
        <line x1="-70" y1="70" x2="-60" y2="60" stroke="#14181E" stroke-width="1.5" />
      </g>
    </g>
    
    <!-- Footer Technical Readout Strip -->
    <rect x="40" y="504" width="520" height="44" fill="#F2F3F0" stroke="#14181E" stroke-width="1" />
    <text x="54" y="524" font-family="'Space Mono', monospace" font-size="9" fill="rgba(20, 24, 30, 0.6)">CALIBRATION METRIC</text>
    <text x="54" y="540" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#14181E">±0.002 mm</text>
    
    <text x="240" y="524" font-family="'Space Mono', monospace" font-size="9" fill="rgba(20, 24, 30, 0.6)">ACCURACY / TOL</text>
    <text x="240" y="540" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#14181E">±0.0015% F.S.</text>
    
    <text x="420" y="524" font-family="'Space Mono', monospace" font-size="9" fill="rgba(20, 24, 30, 0.6)">CONRAD VERIFICATION</text>
    <text x="420" y="540" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#C85A32">[PASSED // STAGE 2]</text>
  </svg>