<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" style="background: #FFFFFF;">
    <defs>
      <pattern id="grid-story-04" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(20, 24, 30, 0.05)" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid-story-04)" />
    
    <!-- Outer Precision Border -->
    <rect x="24" y="24" width="552" height="552" fill="none" stroke="rgba(20, 24, 30, 0.3)" stroke-width="1.5" />
    
    <!-- Chamfered Terracotta Accent Notch -->
    <polygon points="576,24 576,48 552,24" fill="#C85A32" />
    
    <!-- Technical Corner Calipers -->
    <path d="M 32 44 L 44 44 M 44 32 L 44 44" fill="none" stroke="rgba(20, 24, 30, 0.4)" stroke-width="1" />
    <path d="M 568 556 L 556 556 M 556 568 L 556 556" fill="none" stroke="rgba(20, 24, 30, 0.4)" stroke-width="1" />
    <path d="M 32 556 L 44 556 M 44 568 L 44 556" fill="none" stroke="rgba(20, 24, 30, 0.4)" stroke-width="1" />
    
    <!-- Header Block (Coalowl Helvetica Neue / Sentence Case) -->
    <text x="42" y="58" font-family="'JetBrains Mono', 'Space Mono', monospace" font-size="10" font-weight="700" fill="#C85A32" letter-spacing="1.5">[CHAPTER 04 &#8226; FIELD DEPLOYMENT]</text>
    <text x="42" y="82" font-family="'Helvetica neue', 'Noto Sans JP', sans-serif" font-size="20" font-weight="500" fill="#14181E" letter-spacing="-0.3">Stratospheric surveillance envelope</text>
    <text x="42" y="101" font-family="'Helvetica neue', 'Noto Sans JP', sans-serif" font-size="11" fill="rgba(20, 24, 30, 0.65)" letter-spacing="0.2">Persistent high-altitude early wildfire interception and real-time telemetry</text>
    
    <line x1="42" y1="114" x2="558" y2="114" stroke="rgba(20, 24, 30, 0.12)" stroke-width="1" />
    
    <!-- Central Schematic Diagram -->
    <g transform="translate(300, 310)">
      <!-- Coordinate Crosshairs -->
      <line x1="-220" y1="0" x2="220" y2="0" stroke="rgba(20, 24, 30, 0.15)" stroke-width="1" stroke-dasharray="3,3" />
      <line x1="0" y1="-160" x2="0" y2="160" stroke="rgba(20, 24, 30, 0.15)" stroke-width="1" stroke-dasharray="3,3" />
      
      <!-- Primary Geometry -->
      <circle cx="0" cy="0" r="140" fill="none" stroke="rgba(20, 24, 30, 0.5)" stroke-width="1.5" />
      <circle cx="0" cy="0" r="115" fill="none" stroke="rgba(20, 24, 30, 0.2)" stroke-width="1" stroke-dasharray="4,4" />
      <circle cx="0" cy="0" r="75" fill="none" stroke="#14181E" stroke-width="1.2" />
      <circle cx="0" cy="0" r="32" fill="rgba(200, 90, 50, 0.08)" stroke="#C85A32" stroke-width="1.5" />
      <circle cx="0" cy="0" r="5" fill="#C85A32" />
      
      <!-- Monolithic Cell Chamber Contour -->
      <polygon points="-85,-48 -48,-85 48,-85 85,-48 85,48 48,85 -48,85 -85,48" fill="none" stroke="#14181E" stroke-width="1.5" />
      
      <!-- Dimension Callout Line -->
      <line x1="-155" y1="-135" x2="-155" y2="135" stroke="rgba(20, 24, 30, 0.4)" stroke-width="1" />
      <path d="M -160 -135 L -150 -135 M -160 135 L -150 135" stroke="rgba(20, 24, 30, 0.4)" stroke-width="1" />
      <text x="-180" y="5" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(20, 24, 30, 0.6)" transform="rotate(-90, -180, 5)">SPECIMEN Ø 270 mm</text>
      
      <!-- Flow Vector Angle -->
      <line x1="0" y1="0" x2="-88.99186938124421" y2="-64.65637775217203" stroke="#C85A32" stroke-width="2" />
      <circle cx="-88.99186938124421" cy="-64.65637775217203" r="4" fill="#C85A32" />
      
      <!-- Scale Registration Marks -->
      <g transform="rotate(54)">
        <line x1="-65" y1="-65" x2="-55" y2="-55" stroke="#14181E" stroke-width="1.5" />
        <line x1="65" y1="-65" x2="55" y2="-55" stroke="#14181E" stroke-width="1.5" />
        <line x1="65" y1="65" x2="55" y2="55" stroke="#14181E" stroke-width="1.5" />
        <line x1="-65" y1="65" x2="-55" y2="55" stroke="#14181E" stroke-width="1.5" />
      </g>
    </g>
    
    <!-- Footer Technical Readout Strip -->
    <rect x="42" y="504" width="516" height="44" fill="#F2F3F0" stroke="rgba(20, 24, 30, 0.2)" stroke-width="1" />
    <text x="56" y="523" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(20, 24, 30, 0.6)">OPERATING CEILING</text>
    <text x="56" y="539" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#C85A32">65,000 ft ASL</text>
    
    <text x="260" y="523" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(20, 24, 30, 0.6)">THERMAL LATENCY</text>
    <text x="260" y="539" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#14181E">42 ms detection</text>
    
    <text x="440" y="523" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(20, 24, 30, 0.6)">CONRAD STAGE</text>
    <text x="440" y="539" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#14181E">[BENCH PASS]</text>
  </svg>