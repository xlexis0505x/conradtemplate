[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q --tb=short
markers =
    routing: Tests for client-side routing and URL qualification
    editions: Tests for Global (DRUNKEAST) vs China (POSEIDON) content
    interactive: Tests for Bento modal, 3D model, and DOM interactions
    health: Tests for console errors, asset timeouts, and LCP budgets
    live: Tests configured to run against live GitHub Pages
