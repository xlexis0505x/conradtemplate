name: Deploy Conrad Prototype to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install Dependencies for Tests
        run: |
          pip install pytest pytest-playwright pillow
          playwright install chromium

      - name: Run Tests
        run: |
          bash ./scripts/test.sh

      - name: Build site artifact
        run: |
          python3 - << 'EOF'
          import os, shutil, re

          src = 'conrad.prototype'
          dest = '_site'

          if os.path.exists(dest):
            shutil.rmtree(dest)

          os.makedirs(dest, exist_ok=True)

          # Collect actively referenced video & image assets from Conrad route definitions
          active_videos = set()
          active_images = set()
          for j in ['index.json', 'cn.json', 'about.json', 'business.json', 'technology.json']:
            jp = os.path.join(src, j)
            if os.path.exists(jp):
              with open(jp, 'r', encoding='utf-8') as f:
                content = f.read()
              for m in re.finditer(r'file-([a-f0-9]+)-mp4', content):
                active_videos.add(m.group(1) + '.mp4')
              for m in re.finditer(r'image-([a-f0-9]+-[0-9]+x[0-9]+)-([a-z]+)', content):
                active_images.add(f"{m.group(1)}.{m.group(2)}")

          for root, _, files in os.walk(os.path.join(src, 'js')):
            for file in files:
              if file.endswith('.js'):
                with open(os.path.join(root, file), 'r', encoding='utf-8') as f:
                  content = f.read()
                  for m in re.finditer(r'([a-f0-9]{40}-[0-9]+x[0-9]+\.(?:png|jpg|jpeg|webp))', content):
                    active_images.add(m.group(1))

          with open(os.path.join(src, 'index.html'), 'r', encoding='utf-8') as f:
            content = f.read()
            for m in re.finditer(r'([a-f0-9]{40}-[0-9]+x[0-9]+\.(?:png|jpg|jpeg|webp))', content):
              active_images.add(m.group(1))

          # Copy prototype assets and pages with payload optimization filter
          for item in os.listdir(src):
            if item in ['air', 'arsenal', 'land', 'lattice', 'models', 'news', 'sea', 'space', 'subterranean', 'infographic-fallback', 'draco', '__pycache__']:
              continue
            if item.endswith('.json') and item not in ['index.json', 'cn.json', 'technology.json', 'business.json', 'about.json', '404.json', '400.json']:
              continue
            if item.endswith(('.py', '.md', '.orig')):
              continue

            s = os.path.join(src, item)
            d = os.path.join(dest, item)
            if os.path.isdir(s):
              if item == '_external':
                def filter_external(dir_path, filenames):
                  ignored = set()
                  if 'files' in dir_path:
                    for f in filenames:
                      if f.endswith('.mp4') and f not in active_videos:
                        ignored.add(f)
                  if dir_path.endswith('production'):
                    for f in filenames:
                      if f not in active_images:
                        ignored.add(f)
                  return ignored
                shutil.copytree(s, d, symlinks=True, ignore=filter_external)
              elif item == 'assets':
                def filter_assets(dir_path, filenames):
                  ignored = set()
                  if 'products' in dir_path or 'geometry' in dir_path:
                    for f in filenames:
                      ignored.add(f)
                  return ignored
                shutil.copytree(s, d, symlinks=True, ignore=filter_assets)
              else:
                shutil.copytree(s, d, symlinks=True)
            else:
              shutil.copy2(s, d)

          # Compress active sanity images in _site to reduce network transfer payload
          img_site_dir = os.path.join(dest, '_external', 'cdn.sanity.io', 'images', '61nocsj5', 'production')
          if os.path.exists(img_site_dir):
            try:
              from PIL import Image
              for fname in os.listdir(img_site_dir):
                fpath = os.path.join(img_site_dir, fname)
                tmp_out = fpath + '.tmp'
                try:
                  with Image.open(fpath) as im:
                    if fname.endswith('.png'):
                      if im.mode in ('RGBA', 'LA') or (im.mode == 'P' and 'transparency' in im.info):
                        im.quantize(colors=256).save(tmp_out, 'PNG', optimize=True)
                      else:
                        im.convert('RGB').quantize(colors=256).save(tmp_out, 'PNG', optimize=True)
                    elif fname.endswith(('.jpg', '.jpeg')):
                      im.convert('RGB').save(tmp_out, 'JPEG', quality=82, optimize=True)
                  if os.path.exists(tmp_out) and os.path.getsize(tmp_out) < os.path.getsize(fpath):
                    os.replace(tmp_out, fpath)
                  elif os.path.exists(tmp_out):
                    os.remove(tmp_out)
                except Exception:
                  if os.path.exists(tmp_out):
                    os.remove(tmp_out)
            except Exception as e:
              print(f'Image compression step skipped: {e}')

          # Ensure .nojekyll is present so GitHub Pages serves _external without filtering
          with open(os.path.join(dest, '.nojekyll'), 'w') as f:
            f.write('')

          # Bake base href="/conradtemplate/" for GitHub Pages
          with open(os.path.join(dest, 'index.html'), 'r', encoding='utf-8') as f:
            html = f.read()

          html = html.replace('<base href="/"', '<base href="/conradtemplate/"')
          with open(os.path.join(dest, 'index.html'), 'w', encoding='utf-8') as f:
            f.write(html)

          shutil.copy2(os.path.join(dest, 'index.html'), os.path.join(dest, '404.html'))

          for route in ['technology', 'business', 'about']:
            rdir = os.path.join(dest, route)
            os.makedirs(rdir, exist_ok=True)
            shutil.copy2(os.path.join(dest, 'index.html'), os.path.join(rdir, 'index.html'))

          # Create China round version in cn/ directory
          cn_dir = os.path.join(dest, 'cn')
          os.makedirs(cn_dir, exist_ok=True)

          # Pre-inject window.CONRAD_EDITION = 'china' into cn/index.html
          cn_html = html.replace('<head>', '<head><script>window.CONRAD_EDITION="china";</script>', 1)
          with open(os.path.join(cn_dir, 'index.html'), 'w', encoding='utf-8') as f:
            f.write(cn_html)

          shutil.copy2(os.path.join(cn_dir, 'index.html'), os.path.join(cn_dir, '404.html'))

          for route in ['technology', 'business', 'about']:
            rdir = os.path.join(cn_dir, route)
            os.makedirs(rdir, exist_ok=True)
            shutil.copy2(os.path.join(cn_dir, 'index.html'), os.path.join(rdir, 'index.html'))

          # Copy JSON data files to cn/ directory as well
          for jf in ['index.json', 'technology.json', 'business.json', 'about.json']:
            jpath = os.path.join(dest, jf)
            if os.path.exists(jpath):
              shutil.copy2(jpath, os.path.join(cn_dir, jf))

          # Ensure cn.json exists at root of dest so Hydrax route loader resolves cleanly
          if os.path.exists(os.path.join(dest, 'index.json')):
            shutil.copy2(os.path.join(dest, 'index.json'), os.path.join(dest, 'cn.json'))

          print('Built _site artifact successfully.')
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
