<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Janus 3D Test</title>
  <script type="importmap">
  {
    "imports": {
      "three": "./assets/js/lib/three.module.js",
      "three/": "./assets/js/lib/"
    }
  }
  </script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #ede8e1; }
    canvas { width: 100vw; height: 100vh; display: block; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script type="module">
    import { JanusScene } from "./janus-engine.js";
    const canvas = document.getElementById("c");
    const scene = new JanusScene(canvas);
    scene.setSize(window.innerWidth, window.innerHeight);
    scene.setProgress(0.3, [1, 0.5, 0, 0, 0]);
    window.scene = scene;
    console.log("JanusScene created successfully!");
  </script>
</body>
</html>
