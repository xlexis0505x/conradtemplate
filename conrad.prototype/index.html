/* === 4. ABOUT PAGE: WALK ALONE SCROLL SHOWCASE (DRUNKEAST) === */
#conrad-walkalone-track {
  position: relative;
  width: 100%;
  height: 620vh;
  background-color: #000000;
  z-index: 10;
}

#conrad-walkalone-sticky {
  position: sticky;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background-color: #000000;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Diagonal Background Conveyor Strip */
.walkalone-diagonal-strip {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 440px;
  height: 320vh;
  background: rgba(255, 255, 255, 0.04);
  border-left: 1px solid rgba(255, 255, 255, 0.32);
  border-right: 1px solid rgba(255, 255, 255, 0.32);
  transform: translate(-50%, -50%) rotate(-22deg);
  pointer-events: none;
  z-index: 1;
  box-sizing: border-box;
  will-change: width, transform, opacity;
}

.walkalone-stage {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 2;
}

.walkalone-cards-container {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  transform: rotate(-22deg);
}

.walkalone-card-item {
  position: absolute;
  top: 0;
  left: 0;
  width: 360px;
  height: 225px;
  border-radius: 4px;
  overflow: hidden;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.12);
  cursor: pointer;
  pointer-events: auto;
  transform-origin: center center;
  transition: box-shadow 0.3s ease, border-color 0.3s ease;
  will-change: transform, opacity;
  background: #0a0a0a;
}

.walkalone-card-item:hover {
  border-color: rgba(255, 255, 255, 0.38);
  box-shadow: 0 32px 85px rgba(0, 0, 0, 0.95);
}

.walkalone-card-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  user-select: none;
  pointer-events: none;
}

/* Left Column: Rolling Drum DRUNKEAST Letters */
.walkalone-counter {
  position: absolute;
  left: clamp(2rem, 7vw, 7rem);
  top: 50%;
  transform: translateY(-50%);
  width: 160px;
  height: 180px;
  pointer-events: none;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
}

.walkalone-counter-inner {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.walkalone-letter-item {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'HelveticaNowDisplay', Helvetica, Arial, sans-serif !important;
  font-weight: 700;
  font-size: clamp(80px, 9vw, 130px);
  line-height: 1;
  color: #ffffff;
  letter-spacing: -0.04em;
  will-change: transform, opacity;
  text-align: center;
}

/* Right Column: Active Subsystem Metadata */
.walkalone-info-panel {
  position: absolute;
  right: clamp(1.5rem, 5vw, 4.5rem);
  top: 48%;
  transform: translateY(-50%);
  width: clamp(240px, 22vw, 320px);
  pointer-events: none;
  z-index: 5;
  font-family: 'HelveticaNowDisplay', Helvetica, Arial, sans-serif !important;
}

.walkalone-info-item {
  position: absolute;
  top: 50%;
  right: 0;
  transform: translateY(-50%);
  width: 100%;
  opacity: 0;
  transition: opacity 0.35s ease, transform 0.35s ease;
  pointer-events: none;
}

.walkalone-info-item.active {
  opacity: 1;
  transform: translateY(-50%);
  pointer-events: auto;
}

.walkalone-info-stage {
  font-size: 0.72rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.45);
  margin-bottom: 0.4rem;
  font-weight: 600;
}

.walkalone-info-title {
  font-size: clamp(1.2rem, 1.8vw, 1.7rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  color: #ffffff;
  margin-bottom: 0.5rem;
  line-height: 1.15;
}

.walkalone-info-subtitle {
  font-size: 0.85rem;
  color: rgba(255, 255, 255, 0.65);
  margin-bottom: 0.75rem;
  line-height: 1.4;
  font-weight: 400;
}

.walkalone-info-desc {
  font-size: 0.75rem;
  color: rgba(255, 255, 255, 0.38);
  line-height: 1.55;
}

/* Bottom DRUNKEAST Word Navigation (Border removed, clean floating) */
.walkalone-steps-indicator {
  position: absolute;
  bottom: 2.25rem;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: clamp(14px, 1.8vw, 24px);
  z-index: 10;
  pointer-events: auto;
  background: transparent !important;
  border: none !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  padding: 0 !important;
  transition: opacity 0.32s cubic-bezier(0.16, 1, 0.3, 1), transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
}

.walkalone-step-letter {
  font-family: 'HelveticaNowDisplay', Helvetica, Arial, sans-serif !important;
  font-size: clamp(12px, 1vw, 14px);
  font-weight: 500;
  color: rgba(255, 255, 255, 0.32);
  letter-spacing: 0.16em;
  cursor: pointer;
  position: relative;
  padding: 4px 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: color 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
  user-select: none;
  line-height: 1;
}

.walkalone-step-letter:hover {
  color: rgba(255, 255, 255, 0.75);
  transform: translateY(-1px) scale(1.1);
}

.walkalone-step-letter.active {
  color: #ffffff;
  font-weight: 800;
  transform: translateY(-2px) scale(1.35);
  text-shadow: 0 0 12px rgba(255, 255, 255, 0.45);
}

.walkalone-step-letter::after {
  content: "";
  position: absolute;
  bottom: -3px;
  left: 50%;
  transform: translateX(-50%) scaleX(0);
  width: 14px;
  height: 2px;
  background-color: #ffffff;
  border-radius: 1px;
  opacity: 0;
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
}

.walkalone-step-letter.active::after {
  transform: translateX(-50%) scaleX(1);
  opacity: 1;
}

/* Walk Alone In-Situ Inspection State (Diagonal Bars in & out) */
.walkalone-card-item.inspecting {
  cursor: zoom-out !important;
  z-index: 45 !important;
  border-color: rgba(255, 255, 255, 0.35) !important;
  box-shadow: 0 40px 100px rgba(0, 0, 0, 0.98) !important;
}

.walkalone-diagonal-strip.inspect-backdrop {
  pointer-events: auto !important;
  cursor: zoom-out !important;
}

/* Subsystem In-Situ Inspection Sheet (Walk Alone style) */
.walkalone-inspect-sheet {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, 0);
  width: clamp(480px, 58vw, 860px);
  z-index: 40;
  pointer-events: none;
  opacity: 0;
  font-family: 'HelveticaNowDisplay', Helvetica, Arial, sans-serif !important;
}

.walkalone-inspect-sheet.active {
  pointer-events: auto;
}

.walkalone-inspect-sheet-inner {
  padding: 1.6rem 2.25rem 1.85rem;
  background: rgba(10, 10, 10, 0.88);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-top: none;
  border-radius: 0 0 3px 3px;
  box-shadow: 0 30px 70px rgba(0, 0, 0, 0.9);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.walkalone-inspect-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.65rem;
}

.walkalone-inspect-badge {
  font-size: 0.72rem;
  letter-spacing: 0.18em;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.55);
  text-transform: uppercase;
}

.walkalone-inspect-title {
  font-size: clamp(1.4rem, 2vw, 1.85rem);
  font-weight: 700;
  color: #ffffff;
  letter-spacing: -0.02em;
  margin: 0 0 0.4rem 0;
  line-height: 1.15;
}

.walkalone-inspect-subtitle {
  font-size: 0.92rem;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.72);
  margin: 0 0 0.85rem 0;
  line-height: 1.4;
}

.walkalone-inspect-desc {
  font-size: 0.82rem;
  line-height: 1.6;
  color: rgba(255, 255, 255, 0.45);
  margin: 0 0 1rem 0;
}

.walkalone-inspect-hint {
  font-size: 0.65rem;
  letter-spacing: 0.16em;
  color: rgba(255, 255, 255, 0.25);
  text-transform: uppercase;
}

<style id="conrad-nav-styling">
  /* 1. Eliminate the transparent grey page overlay and scroll backdrop masks */
  .navOverlay,
  .HeaderDesktop .navOverlay,
  .HeaderMobile .navOverlay,
  .HeaderDesktop .navWrapper:after,
  .HeaderMobile .mainWrapper > .mainScreen .nav-bg:after,
  .HeaderDesktop:before,
  .HeaderMobile:before,
  .Header .navWrapper:after,
  .Header:before {
    display: none !important;
    opacity: 0 !important;
    pointer-events: none !important;
    visibility: hidden !important;
    content: none !important;
    background: transparent !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
  }

  /* Reset dynamic CSS variables that trigger white/grey washes on scroll */
  :root,
  .HeaderDesktop,
  .HeaderMobile,
  .Header,
  .HeaderDesktop .navWrapper,
  .HeaderMobile .mainWrapper,
  .HeaderMobile .mainWrapper > .mainScreen {
    --backgroundColor: transparent !important;
    --backgroundOpacity: 0 !important;
    --frosted: 0 !important;
  }

  /* Hide top header smoothly when Product3DSlice interactive view dialog is open */
  body:has(.Product3DSlice dialog[open]) .Header,
  body:has(.Product3DSlice dialog[open]) .HeaderDesktop,
  body:has(.Product3DSlice dialog[open]) .HeaderMobile,
  body.modal-3d-open .Header,
  body.modal-3d-open .HeaderDesktop,
  body.modal-3d-open .HeaderMobile {
    opacity: 0 !important;
    visibility: hidden !important;
    pointer-events: none !important;
    transform: translateY(-100%) !important;
    transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.35s ease !important;
  }

  /* 2. Frosted black glass header bar */
  .HeaderDesktop,
  .HeaderDesktop:hover,
  .Header,
  .HeaderMobile {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    background-color: rgba(0, 0, 0, 0.88) !important;
    background: rgba(0, 0, 0, 0.88) !important;
    backdrop-filter: blur(16px) !important;
    -webkit-backdrop-filter: blur(16px) !important;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
    color: #ffffff !important;
    z-index: 99999 !important;
    pointer-events: auto !important;
    opacity: 1 !important;
    visibility: visible !important;
    transform: translateY(0) !important;
    transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.35s ease !important;
  }

  .HeaderDesktop .navWrapper,
  .HeaderMobile .mainWrapper,
  .HeaderMobile .mainWrapper > .mainScreen {
    transform: none !important;
    background: transparent !important;
    background-color: transparent !important;
  }

  .HeaderDesktop a,
  .HeaderDesktop span,
  .HeaderDesktop .HeaderLink,
  .HeaderDesktop .logo,
  .HeaderDesktop svg {
    color: #ffffff !important;
    fill: #ffffff !important;
  }

  /* 3. Coalowl-inspired animated horizontal bar under nav buttons */
  .center-wrapper .HeaderLink {
    position: relative !important;
    display: inline-flex !important;
    align-items: center !important;
    padding-bottom: 4px !important;
    color: #ffffff !important;
    opacity: 0.8 !important;
    text-decoration: none !important;
    transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
  }

  .center-wrapper .HeaderLink:hover {
    opacity: 1 !important;
  }

  .center-wrapper .HeaderLink::after {
    content: "" !important;
    position: absolute !important;
    bottom: -2px !important;
    left: 0 !important;
    width: 100% !important;
    height: 1.5px !important;
    background-color: #ffffff !important;
    transform: scaleX(0) !important;
    transform-origin: left !important;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1) !important;
  }

  .center-wrapper .HeaderLink:hover::after,
  .center-wrapper .HeaderLink.active::after {
    transform: scaleX(1) !important;
  }
</style>
<script id="conrad-route-coordinator">
(function() {
  var lastObservedPath = null;
  var isRouteSyncing = false;

  function syncAllRoutes() {
    if (isRouteSyncing) return;
    isRouteSyncing = true;
    try {
      var p = window.location.pathname.replace(/\/$/, "") || "/";
      var routeChanged = (p !== lastObservedPath);
      if (routeChanged) {
        lastObservedPath = p;
        updateNav(p);
      }

      var isHome = (p === "" || p === "/" || p === "/index.html");
      var isTech = (p === "/technology" || p.startsWith("/technology/"));
      var isBiz = (p === "/business" || p.startsWith("/business/"));
      var isAbout = (p === "/about" || p.startsWith("/about/"));

      // 1. Home Route Sync (Radiant Nuclear 3D reactor)
      var homeTrack = document.getElementById("conrad-radiant-janus-track");
      if (isHome) {
        if (!homeTrack && typeof window.ensureHomeJanus === "function") {
          window.ensureHomeJanus();
        }
      } else if (homeTrack && typeof window.ensureHomeJanus === "function") {
        window.ensureHomeJanus();
      }

      // 2. Technology Route Sync (3D Submarine, Spec Matrix & Comparison)
      var techSpec = document.getElementById("conrad-tech-spec-matrix");
      if (isTech) {
        if (!techSpec && typeof window.ensureTechSections === "function") {
          window.ensureTechSections();
        }
      } else if (techSpec && typeof window.ensureTechSections === "function") {
        window.ensureTechSections();
      }

      // 3. Business Route Sync (Doctrine, Unit Economics, Factory Cells, Roadmap, Diligence)
      var bizDoctrine = document.getElementById("conrad-biz-doctrine");
      if (isBiz) {
        if (!bizDoctrine && typeof window.ensureBizTrack === "function") {
          window.ensureBizTrack();
        }
      } else if (bizDoctrine && typeof window.ensureBizTrack === "function") {
        window.ensureBizTrack();
      }

      // 4. About Route Sync (Walk Alone conveyor & Contact Us block)
      var aboutTrack = document.getElementById("conrad-walkalone-track");
      if (isAbout) {
        if (!aboutTrack && typeof window.ensureAboutTrack === "function") {
          window.ensureAboutTrack();
        }
      } else if (aboutTrack && typeof window.ensureAboutTrack === "function") {
        window.ensureAboutTrack();
      }
    } finally {
      isRouteSyncing = false;
    }
  }

  function updateNav(p) {
    var links = document.querySelectorAll(".center-wrapper .HeaderLink");
    links.forEach(function(l) {
      var href = l.getAttribute("href") ? l.getAttribute("href").replace(/\/$/, "") || "/" : "";
      var isCurrent = (href === p) || (href !== "/" && p.startsWith(href));
      if (isCurrent) {
        l.classList.add("active");
      } else {
        l.classList.remove("active");
      }
    });
  }

  // 3D Modal state watcher for smooth header slide
  function sync3DModal() {
    var dialog = document.querySelector('.Product3DSlice dialog');
    var isOpen = !!(dialog && (dialog.open || dialog.hasAttribute('open')));
    if (document.body.classList.contains('modal-3d-open') !== isOpen) {
      document.body.classList.toggle('modal-3d-open', isOpen);
    }
  }
  setInterval(sync3DModal, 50);

  window.syncAllRoutes = syncAllRoutes;
  window.addEventListener("conrad-locationchange", syncAllRoutes);
  window.addEventListener("popstate", syncAllRoutes);
  setInterval(syncAllRoutes, 100);
  document.addEventListener("DOMContentLoaded", syncAllRoutes);
})();
</script>

<script id="conrad-home-janus-script" type="module">
import { JanusScene } from "./janus-engine.js";

(function() {
  var trackHTML = `
  <div id="conrad-radiant-janus-track">
    <section id="conrad-radiant-janus-sticky">
      <canvas id="janus-canvas" class="janus-canvas"></canvas>
      <div class="janus-inner">
        <div class="janus-head">
          <div>
            <div class="conrad-kicker">01 // THE JANUS PROGRAM</div>
            <h2 class="janus-title">The Janus program</h2>
            <p class="janus-subtitle">Through the Janus program, Radiant and the US military will deploy up to 50 Kaleidos reactors over a 5 year period to power bases and facilities across the country.</p>
          </div>
          <div class="janus-nav">
            <button id="janus-prev" class="janus-btn" aria-label="Previous">&lt;</button>
            <button id="janus-next" class="janus-btn" aria-label="Next">&gt;</button>
          </div>
        </div>

        <div class="janus-captions">
          <div class="janus-step-text active" data-step="0">
            <div class="janus-step-heading janus-line">From prototype to product:</div>
            <div class="janus-step-desc janus-line">Janus volume establishes Kaleidos as a repeatable energy product.</div>
          </div>
          <div class="janus-step-text" data-step="1">
            <div class="janus-step-heading janus-line">Capacity built for scale:</div>
            <div class="janus-step-desc janus-line">Janus accelerates the timeline to mass-produce reactors. Kaleidos will be refined through multiple design iterations incorporating inputs from the government’s top experts.</div>
          </div>
          <div class="janus-step-text" data-step="2">
            <div class="janus-step-heading janus-line">Real-world operating experience:</div>
            <div class="janus-step-desc janus-line">A fleet of Kaleidos will be deployed to bases across the US, generating years of combined operating experience each calendar year. This is an exponential accelerant to Radiant’s readiness for deployments at scale.</div>
          </div>
          <div class="janus-step-text" data-step="3">
            <div class="janus-step-heading janus-line">A proven path to market:</div>
            <div class="janus-step-desc janus-line">The Janus program shortens the runway to adoption across government, national security, data centers, physical AI, 24/7 critical load, main street businesses and more.</div>
          </div>
          <div class="janus-step-text" data-step="4">
            <div class="janus-step-heading janus-line">Volume to reduce costs:</div>
            <div class="janus-step-desc janus-line">The production volume achieved through the Janus program enables the reliability, efficiency and cost reduction required for commercial deployments while reducing costs for government customers.</div>
          </div>
        </div>

        <div class="janus-progress-container">
          <div class="janus-arrow-indicator" id="janus-arrow">
            <svg width="14" height="10" viewBox="0 0 14 10" fill="none">
              <polygon points="7,10 0,0 14,0" fill="#ffffff"/>
            </svg>
          </div>
          <div class="janus-cells">
            <div class="janus-cell" data-step="0"><div class="janus-cell-fill"></div></div>
            <div class="janus-cell" data-step="1"><div class="janus-cell-fill"></div></div>
            <div class="janus-cell" data-step="2"><div class="janus-cell-fill"></div></div>
            <div class="janus-cell" data-step="3"><div class="janus-cell-fill"></div></div>
            <div class="janus-cell" data-step="4"><div class="janus-cell-fill"></div></div>
          </div>
        </div>
      </div>
    </section>
  </div>
  `;

  var janusScene = null;
  var currentStep = 0;
  var lastStep = -1;
  var numSections = 5;
  var captionTimeline = null;
  var eventsBound = false;

  function isHomeRoute() {
    var p = window.location.pathname.replace(/\/$/, "") || "/";
    return p === "" || p === "/" || p === "/index.html";
  }

  function getArrowX(stepIndex) {
    var container = document.querySelector("#conrad-radiant-janus-sticky .janus-progress-container");
    if (!container) return 0;
    return ((stepIndex + 0.5) / numSections) * container.clientWidth;
  }

  function ensureHomeJanus() {
    var onHome = isHomeRoute();
    var track = document.getElementById("conrad-radiant-janus-track");

    if (!onHome) {
      if (janusScene) {
        try { janusScene.dispose(); } catch(e){}
        janusScene = null;
      }
      if (track) track.remove();
      lastStep = -1;
      return;
    }

    var mediaLink = document.querySelector(".MediaLinkSlice");
    var arsenal = document.querySelector(".ArsenalSlice");

    // CRITICAL: Do NOT mount track until either MediaLinkSlice or ArsenalSlice exists in the DOM!
    // Never mount to empty main or before HomeHero, which would cause Janus to appear at the top on refresh!
    if (!mediaLink && !arsenal) return;

    var newlyMounted = false;
    if (!track) {
      var w = document.createElement("div");
      w.innerHTML = trackHTML;
      track = w.firstElementChild;

      if (mediaLink) {
        mediaLink.parentNode.insertBefore(track, mediaLink);
      } else if (arsenal && arsenal.nextSibling) {
        arsenal.parentNode.insertBefore(track, arsenal.nextSibling);
      } else if (arsenal) {
        arsenal.parentNode.appendChild(track);
      }
      newlyMounted = true;
    } else {
      if (mediaLink && track.nextElementSibling !== mediaLink) {
        mediaLink.parentNode.insertBefore(track, mediaLink);
      } else if (!mediaLink && arsenal && track.previousElementSibling !== arsenal) {
        if (arsenal.nextSibling) {
          arsenal.parentNode.insertBefore(track, arsenal.nextSibling);
        } else {
          arsenal.parentNode.appendChild(track);
        }
      }
    }

    var canvas = document.getElementById("janus-canvas");
    if (canvas && !janusScene) {
      try {
        janusScene = new JanusScene(canvas);
        janusScene.setSize(window.innerWidth, window.innerHeight);
        janusScene.requestRender();
      } catch (err) {
        console.error("[janus home 3D scene init error]", err);
      }
    }

    bindJanusEvents();
    updateScroll();

    if (newlyMounted && window.Global && Global.lenis) {
      Global.lenis.resize();
    }
  }

  function updateScroll() {
    if (!isHomeRoute()) return;
    var track = document.getElementById("conrad-radiant-janus-track");
    if (!track) return;

    var rect = track.getBoundingClientRect();
    var trackHeight = track.offsetHeight;
    var viewportHeight = window.innerHeight;
    var scrollableDistance = trackHeight - viewportHeight;

    if (scrollableDistance <= 0) return;

    var scrolled = -rect.top;
    var progress = Math.max(0, Math.min(1, scrolled / scrollableDistance));

    var c = numSections;
    var t = Math.max(0, Math.min(c, progress * c));
    var step = Math.min(c - 1, Math.floor(t));
    currentStep = step;

    var uArr = [];
    for (var i = 0; i < c; i++) {
      uArr[i] = Math.max(0, Math.min(1, t - i));
    }

    if (janusScene) {
      janusScene.setProgress(progress, uArr);
    }

    var cells = document.querySelectorAll("#conrad-radiant-janus-sticky .janus-cell");
    cells.forEach(function(cell, idx) {
      var cellFill = cell.querySelector(".janus-cell-fill");
      if (cellFill) {
        var scale = (idx === step) ? uArr[idx] : 0;
        if (window.gsap) {
          gsap.set(cellFill, { scaleX: scale, transformOrigin: "left center" });
        } else {
          cellFill.style.transform = "scaleX(" + scale + ")";
        }
      }
    });

    if (step !== lastStep) {
      var isInitial = (lastStep === -1);
      lastStep = step;

      var arrow = document.getElementById("janus-arrow");
      if (arrow) {
        var targetX = getArrowX(step);
        if (window.gsap) {
          gsap.to(arrow, {
            x: targetX,
            duration: isInitial ? 0 : 0.45,
            ease: "back.out(0.5)",
            overwrite: true
          });
        }
      }

      cells.forEach(function(cell, idx) {
        var isActive = (idx === step);
        if (isActive) {
          cell.classList.add("active");
        } else {
          cell.classList.remove("active");
        }
      });

      var allStepTexts = document.querySelectorAll("#conrad-radiant-janus-sticky .janus-step-text");
      if (window.gsap) {
        if (captionTimeline) captionTimeline.kill();
        captionTimeline = gsap.timeline();

        allStepTexts.forEach(function(el, idx) {
          var lines = el.querySelectorAll(".janus-line");
          if (idx === step) {
            el.classList.add("active");
            if (isInitial) {
              gsap.set(lines, { y: 0, opacity: 1 });
            } else {
              captionTimeline.fromTo(lines,
                { y: 14, opacity: 0 },
                { y: 0, opacity: 1, duration: 0.5, stagger: 0.08, ease: "power2.out" },
                0.1
              );
            }
          } else {
            el.classList.remove("active");
            gsap.set(lines, { y: 14, opacity: 0 });
          }
        });
      } else {
        allStepTexts.forEach(function(el, idx) {
          if (idx === step) {
            el.classList.add("active");
          } else {
            el.classList.remove("active");
          }
        });
      }

      var prevBtn = document.getElementById("janus-prev");
      var nextBtn = document.getElementById("janus-next");
      if (prevBtn) prevBtn.disabled = (step === 0);
      if (nextBtn) nextBtn.disabled = (step === c - 1);
    }
  }

  function goToStep(targetStep) {
    if (targetStep < 0) targetStep = 0;
    if (targetStep > 4) targetStep = 4;
    var track = document.getElementById("conrad-radiant-janus-track");
    if (!track) return;

    var trackHeight = track.offsetHeight;
    var viewportHeight = window.innerHeight;
    var scrollableDistance = trackHeight - viewportHeight;
    var targetProgress = (targetStep + 0.5) / numSections;
    var trackTop = track.getBoundingClientRect().top + window.pageYOffset;
    var targetScrollY = trackTop + targetProgress * scrollableDistance;

    if (window.Global && Global.lenis) {
      Global.lenis.scrollTo(targetScrollY, { duration: 1.2 });
    } else {
      window.scrollTo({ top: targetScrollY, behavior: "smooth" });
    }
  }

  function bindJanusEvents() {
    if (eventsBound) return;
    eventsBound = true;

    var prevBtn = document.getElementById("janus-prev");
    var nextBtn = document.getElementById("janus-next");
    if (prevBtn) prevBtn.addEventListener("click", function() { goToStep(currentStep - 1); });
    if (nextBtn) nextBtn.addEventListener("click", function() { goToStep(currentStep + 1); });

    var cells = document.querySelectorAll("#conrad-radiant-janus-sticky .janus-cell");
    cells.forEach(function(c) {
      c.addEventListener("click", function() {
        var s = parseInt(c.getAttribute("data-step"), 10);
        goToStep(s);
      });
    });

    if (window.Global && Global.lenis) {
      Global.lenis.on("scroll", updateScroll);
    } else {
      window.addEventListener("scroll", updateScroll, { passive: true });
    }

    window.addEventListener("resize", function() {
      if (janusScene) janusScene.setSize(window.innerWidth, window.innerHeight);
      updateScroll();
    }, { passive: true });
  }

  window.ensureHomeJanus = ensureHomeJanus;
  window.addEventListener("conrad-locationchange", ensureHomeJanus);
  window.addEventListener("popstate", ensureHomeJanus);

  if (document.readyState === "complete" || document.readyState === "interactive") {
    ensureHomeJanus();
  } else {
    document.addEventListener("DOMContentLoaded", ensureHomeJanus);
  }
})();
</script>

    if (!onTech) {

        anchor.parentNode.insertBefore(specMatrix, anchor.nextSibling);
      } else if (main) {
        main.appendChild(specMatrix);
      }
      bindSpecTabs();
      newlyMounted = true;
    } else {
      if (qualities && specMatrix.nextElementSibling !== qualities && specMatrix !== qualities) {
        qualities.parentNode.insertBefore(specMatrix, qualities);

    if (!compareSec && specMatrix) {
      var w2 = document.createElement("div");
      w2.innerHTML = comparisonHTML;

    var tabs = document.querySelectorAll(".conrad-spec-tab");
    var rows = document.querySelectorAll(".conrad-spec-row");
    var schematics = document.querySelectorAll(".conrad-schematic-card");

    tabs.forEach(function(tab) {
      tab.addEventListener("click", function() {
        if (tab.classList.contains("active")) return;

        tabs.forEach(function(t) { t.classList.remove("active"); });
        tab.classList.add("active");
        var filter = tab.getAttribute("data-filter");

        // 1. Crossfade schematic preview cards
        schematics.forEach(function(card) {
          if (card.getAttribute("data-schematic") === filter) {
            card.classList.add("active");
          } else {
            card.classList.remove("active");
          }
        });

        // 2. Filter spec rows with smooth staggered slide-in
        var matchingRows = [];
        var nonMatchingRows = [];

        rows.forEach(function(r) {
          if (filter === "all" || r.getAttribute("data-category") === filter) {
            matchingRows.push(r);
          } else {
            nonMatchingRows.push(r);
          }
        });

        // Instantly hide non-matching rows to eliminate dead space
        nonMatchingRows.forEach(function(r) {
          r.style.setProperty("display", "none", "important");
          r.style.opacity = "0";
        });

        // Reveal matching rows with staggered entrance
        matchingRows.forEach(function(r) {
          r.style.setProperty("display", "grid", "important");
        });

        if (window.gsap) {
          gsap.killTweensOf(matchingRows);
          gsap.fromTo(matchingRows, 
            { opacity: 0, y: 8 },
            { 
              opacity: 1, 
              y: 0, 
              duration: 0.35, 
              stagger: 0.035, 
              ease: "power2.out",
              clearProps: "transform"
            }
          );
        } else {
          matchingRows.forEach(function(r, index) {
            setTimeout(function() {
              r.style.opacity = "1";
            }, index * 30);
          });
        }

        if (window.Global && Global.lenis) {
          Global.lenis.resize();
        }
      });
    });
  }

<script id="conrad-bento-zoom-script">
(function() {

    {
      title: "01 // Propulsion Core",
      subtitle: "High-Throughput Thermodynamic Cycle & Integrated Powertrain",
      desc: "Engineered for maximum reliability and responsive thrust modulation in contested flight profiles, eliminating single-point mechanical valves in favor of software-governed electromagnetic pintle actuation.",

    {
      title: "02 // Autonomous Guidance",
      subtitle: "Real-Time Sensor Fusion & Edge Tactical Processing",

    {
      title: "04 // Modular Payload Bay",
      subtitle: "Rapid Turnaround & Standard Mechanical Interface",
      desc: "Software-defined reconfigurable architecture supporting kinetic, electronic warfare, and sensor packages with automated interface handshake and sub-90-second mechanical swap times.",
      image: "/_external/cdn.sanity.io/images/61nocsj5/production/955e14dfee80e6022b1744580b6996cd435c6153-976x1952.jpg"
    },
    {
      title: "05 // Swarm & Mesh Network",
      subtitle: "Resilient Distributed Telemetry Across Operating Theaters",
      desc: "Decentralized ad-hoc directional communication protocol immune to single-node degradation, enabling autonomous consensus and distributed cooperative mission execution.",
      image: "/_external/cdn.sanity.io/images/61nocsj5/production/35c91ba3a0603c99720933d52bad4c73f9fdca5f-3000x1500.jpg"
    },
    {
      title: "06 // Expeditionary Logistics",
      subtitle: "Zero Specialized Ground Infrastructure Required",
      desc: "Austere-field deployment capability containerized in standard military pallet footprints, enabling launch and operation without specialized runways or depot tooling.",
      image: "/_external/cdn.sanity.io/images/61nocsj5/production/16113e3a588bd30e5c67bf2ee6d7a0847845fb28-3000x3000.jpg"
    },
    {
      title: "07 // Sovereign Tooling",
      subtitle: "Software-Defined Precision Assembly & Mass Production",
      desc: "Arsenal-scale automated manufacturing workcells guided by digital twin simulations, delivering rapid aerospace-grade serial production at a fraction of traditional lead times.",
      image: "/_external/cdn.sanity.io/images/61nocsj5/production/a005eecc853d709de52769704c0a6cc1083ac7c4-1131x630.png"
    }
  ];

  var activeCard = null;
  var isClosing = false;
  var isOpen = false;

  function ensureModalDOM() {
    // Remove old remnants if any
    var oldBackdrop = document.getElementById("conrad-inspection-backdrop");
    if (oldBackdrop) oldBackdrop.remove();
    var oldPanel = document.getElementById("conrad-inspection-panel");
    if (oldPanel) oldPanel.remove();

    // Clean old pills
    document.querySelectorAll(".inspect-pill").forEach(function(p) { p.remove(); });

    if (document.getElementById("conrad-bento-modal")) return;

    var modal = document.createElement("div");
    modal.id = "conrad-bento-modal";
    modal.innerHTML = `
      <div class="bento-modal-backdrop"></div>
      <div class="bento-modal-container">
        <div class="bento-modal-media">
          <img id="bento-modal-img" src="" alt="Subsystem Expanded View">
        </div>
        <div class="bento-modal-info">
          <h3 class="bento-modal-title" id="bento-modal-title"></h3>
          <div class="bento-modal-subtitle" id="bento-modal-subtitle"></div>
          <p class="bento-modal-desc" id="bento-modal-desc"></p>
        </div>
      </div>
    `;
    document.body.appendChild(modal);

    modal.addEventListener("click", function(e) {
      e.preventDefault();
      e.stopPropagation();
      zoomBack();
    });
  }

  function zoomOutwards(card, index) {
    if (isOpen || isClosing) return;
    ensureModalDOM();

    var data = SUB_DATA[index];
    if (!data) return;

    var modal = document.getElementById("conrad-bento-modal");
    var container = modal.querySelector(".bento-modal-container");
    var backdrop = modal.querySelector(".bento-modal-backdrop");
    var imgEl = document.getElementById("bento-modal-img");
    var titleEl = document.getElementById("bento-modal-title");
    var subEl = document.getElementById("bento-modal-subtitle");
    var descEl = document.getElementById("bento-modal-desc");

    // Prefer high quality loaded card image
    var cardImg = card.querySelector("img");
    var imgSrc = (cardImg && (cardImg.currentSrc || cardImg.src)) || data.image;

    imgEl.src = imgSrc;
    titleEl.textContent = data.title;
    subEl.textContent = data.subtitle;
    descEl.textContent = data.desc;

    activeCard = card;
    isOpen = true;

    var cardRect = card.getBoundingClientRect();

    modal.style.display = "flex";
    modal.classList.add("active");

    if (window.gsap) {
      gsap.killTweensOf([container, backdrop]);
      var finalRect = container.getBoundingClientRect();

      var scaleX = Math.max(0.2, cardRect.width / finalRect.width);
      var scaleY = Math.max(0.2, cardRect.height / finalRect.height);
      var deltaX = (cardRect.left + cardRect.width / 2) - (finalRect.left + finalRect.width / 2);
      var deltaY = (cardRect.top + cardRect.height / 2) - (finalRect.top + finalRect.height / 2);

      gsap.fromTo(backdrop, 
        { opacity: 0, backdropFilter: "blur(0px)", WebkitBackdropFilter: "blur(0px)" }, 
        { opacity: 1, backdropFilter: "blur(14px)", WebkitBackdropFilter: "blur(14px)", duration: 0.38, ease: "power2.out" }
      );

      gsap.fromTo(container,
        {
          x: deltaX,
          y: deltaY,
          scaleX: scaleX,
          scaleY: scaleY,
          opacity: 0.85,
          transformOrigin: "center center"
        },
        {
          x: 0,
          y: 0,
          scaleX: 1,
          scaleY: 1,
          opacity: 1,
          duration: 0.42,
          ease: "power3.out"
        }
      );
    }
  }

  function zoomBack() {
    if (!isOpen || isClosing) return;
    isClosing = true;

    var modal = document.getElementById("conrad-bento-modal");
    if (!modal) {
      isOpen = false;
      isClosing = false;
      return;
    }

    var container = modal.querySelector(".bento-modal-container");
    var backdrop = modal.querySelector(".bento-modal-backdrop");

    if (window.gsap && activeCard) {
      var currentCardRect = activeCard.getBoundingClientRect();
      var finalRect = container.getBoundingClientRect();

      var scaleX = Math.max(0.2, currentCardRect.width / finalRect.width);
      var scaleY = Math.max(0.2, currentCardRect.height / finalRect.height);
      var deltaX = (currentCardRect.left + currentCardRect.width / 2) - (finalRect.left + finalRect.width / 2);
      var deltaY = (currentCardRect.top + currentCardRect.height / 2) - (finalRect.top + finalRect.height / 2);

      gsap.killTweensOf([container, backdrop]);

      gsap.to(backdrop, {
        opacity: 0,
        backdropFilter: "blur(0px)",
        WebkitBackdropFilter: "blur(0px)",
        duration: 0.3,
        ease: "power2.inOut"
      });

      gsap.to(container, {
        x: deltaX,
        y: deltaY,
        scaleX: scaleX,
        scaleY: scaleY,
        opacity: 0,
        duration: 0.32,
        ease: "power2.inOut",
        onComplete: function() {
          modal.style.display = "none";
          modal.classList.remove("active");
          gsap.set(container, { clearProps: "all" });
          gsap.set(backdrop, { clearProps: "all" });
          isOpen = false;
          isClosing = false;
          activeCard = null;
        }
      });
    } else {
      modal.style.display = "none";
      modal.classList.remove("active");
      isOpen = false;
      isClosing = false;
      activeCard = null;
    }
  }

  function attachCardListeners() {
    var p = window.location.pathname.replace(/\/$/, "") || "/";
    if (p !== "" && p !== "/" && p !== "/index.html") return;
    ensureModalDOM();

    var cards = document.querySelectorAll(".FeaturedProductsCard");
    cards.forEach(function(card, idx) {
      // Remove any unwanted pills
      var pill = card.querySelector(".inspect-pill");
      if (pill) pill.remove();

      if (!card.dataset.bentoZoomBound) {
        card.dataset.bentoZoomBound = "true";
        card.dataset.bentoIndex = idx;

        card.addEventListener("click", function(e) {
          e.preventDefault();
          e.stopPropagation();

          if (isClosing) return;
          var index = parseInt(card.dataset.bentoIndex, 10);
          if (isOpen && activeCard === card) {
            zoomBack();
          } else {
            zoomOutwards(card, index);
          }
        }, true);
      }
    });
  }

  document.addEventListener("keydown", function(e) {
    if (e.key === "Escape" || e.keyCode === 27) {
      zoomBack();
    }
  });

  var checkTimer = setInterval(attachCardListeners, 250);

  if (document.readyState === "complete" || document.readyState === "interactive") {
    attachCardListeners();
  } else {
    window.addEventListener("DOMContentLoaded", attachCardListeners);
    window.addEventListener("load", attachCardListeners);
  }
})();
</script>

            </div>
            <h2 class="walkalone-inspect-title" id="walkalone-inspect-title"></h2>
            <div class="walkalone-inspect-subtitle" id="walkalone-inspect-subtitle"></div>
            <p class="walkalone-inspect-desc" id="walkalone-inspect-desc"></p>

  function generateContactHTML() {

      ? window.generateContactHTML("02 // CONTACT &amp; ENGAGEMENT") 
      : "";
  }

  var isInspectOpen = false;
  var isInspectAnimating = false;
  var activeInspectIndex = -1;

  function openWalkInspect(card, index) {
    if (isInspectOpen || isInspectAnimating) return;
    isInspectAnimating = true;
    isInspectOpen = true;
    activeInspectIndex = index;

    // Freeze page scroll so inspect mode does not jitter or drift
    if (window.Global && Global.lenis) {
      Global.lenis.stop();
    }

    var data = WALK_DATA[index];
    if (!data) return;

    var track = document.getElementById("conrad-walkalone-track");
    var strip = document.getElementById("walkalone-strip");
    var cardsWrap = document.getElementById("walkalone-cards-wrap");
    var sheet = document.getElementById("walkalone-inspect-sheet");
    var counter = document.getElementById("walkalone-counter");
    var info = document.getElementById("walkalone-info");
    var nav = document.getElementById("walkalone-steps-nav");

    // Populate inspection sheet
    var badgeEl = document.getElementById("walkalone-inspect-badge");
    var titleEl = document.getElementById("walkalone-inspect-title");
    var subEl = document.getElementById("walkalone-inspect-subtitle");
    var descEl = document.getElementById("walkalone-inspect-desc");

    if (badgeEl) badgeEl.textContent = data.stage;
    if (titleEl) titleEl.textContent = data.title;
    if (subEl) subEl.textContent = data.subtitle;
    if (descEl) descEl.textContent = data.desc;

    if (strip) strip.classList.add("inspect-backdrop");

    if (window.gsap) {
      // 1. Diagonal bars sweep out across screen
      gsap.to(strip, {
        width: "160vw",
        rotation: 0,
        backgroundColor: "rgba(8, 8, 8, 0.96)",
        duration: 0.72,
        ease: "power3.inOut"
      });

      // 2. Cards container rotates from -22deg to 0deg
      gsap.to(cardsWrap, {
        rotation: 0,
        duration: 0.72,
        ease: "power3.inOut"
      });

      // 3. Active card expands in-place; other cards glide outward along track
      var allCards = track.querySelectorAll(".walkalone-card-item");
      var heroW = Math.min(window.innerWidth * 0.58, 860);
      var heroH = Math.min(window.innerHeight * 0.42, 460);
      var cardY = -70;

      allCards.forEach(function(c, i) {
        if (i === index) {
          c.classList.add("inspecting");
          gsap.to(c, {
            xPercent: -50,
            yPercent: -50,
            x: 0,
            y: cardY,
            rotation: 0,
            width: heroW,
            height: heroH,
            scale: 1,
            opacity: 1,
            duration: 0.72,
            ease: "power3.inOut"
          });
        } else {
          var dir = (i < index) ? -1 : 1;
          gsap.to(c, {
            xPercent: -50,
            yPercent: -50,
            x: 0,
            y: dir * 1400,
            rotation: 0,
            opacity: 0,
            duration: 0.52,
            ease: "power2.inOut"
          });
        }
      });

      // 4. Fade out side UI and bottom navigation
      if (counter) gsap.to(counter, { opacity: 0, x: -60, duration: 0.45, ease: "power2.inOut" });
      if (info) gsap.to(info, { opacity: 0, x: 60, duration: 0.45, ease: "power2.inOut" });
      if (nav) gsap.to(nav, { opacity: 0, y: 20, duration: 0.45, ease: "power2.inOut" });

      // 5. Slide in detail inspection sheet directly below hero card
      if (sheet) {
        var sheetTopY = cardY + (heroH / 2) + 1;
        sheet.style.width = heroW + "px";
        sheet.classList.add("active");
        gsap.fromTo(sheet,
          { opacity: 0, xPercent: -50, y: sheetTopY + 30 },
          {
            opacity: 1,
            xPercent: -50,
            y: sheetTopY,
            duration: 0.5,
            delay: 0.32,
            ease: "power3.out",
            onComplete: function() {
              isInspectAnimating = false;
            }
          }
        );
      } else {
        isInspectAnimating = false;
      }
    } else {
      isInspectAnimating = false;
    }
  }

  function closeWalkInspect() {
    if (!isInspectOpen || isInspectAnimating) return;
    isInspectAnimating = true;

    var track = document.getElementById("conrad-walkalone-track");
    var strip = document.getElementById("walkalone-strip");
    var cardsWrap = document.getElementById("walkalone-cards-wrap");
    var sheet = document.getElementById("walkalone-inspect-sheet");
    var counter = document.getElementById("walkalone-counter");
    var info = document.getElementById("walkalone-info");
    var nav = document.getElementById("walkalone-steps-nav");

    if (strip) strip.classList.remove("inspect-backdrop");

    if (window.gsap) {
      // 1. Hide inspect sheet
      if (sheet) {
        gsap.to(sheet, {
          opacity: 0,
          y: "+=20",
          duration: 0.25,
          ease: "power2.in",
          onComplete: function() {
            sheet.classList.remove("active");
          }
        });
      }

      // 2. Diagonal bars close back in: strip contracts back to 440px and -22deg
      gsap.to(strip, {
        width: 440,
        rotation: -22,
        backgroundColor: "rgba(255, 255, 255, 0.04)",
        duration: 0.68,
        ease: "power3.inOut"
      });

      // 3. Cards container rotates back to -22deg
      gsap.to(cardsWrap, {
        rotation: -22,
        duration: 0.68,
        ease: "power3.inOut"
      });

      // Compute exact current floatIndex from scroll position
      var rect = track.getBoundingClientRect();
      var scrollDistance = track.offsetHeight - window.innerHeight;
      var progress = Math.max(0, Math.min(1, -rect.top / Math.max(1, scrollDistance)));
      var floatIndex = progress * (WALK_DATA.length - 1);

      // 4. Smoothly animate ALL cards back to their conveyor positions synchronously
      var allCards = track.querySelectorAll(".walkalone-card-item");
      allCards.forEach(function(card, idx) {
        var d = idx - floatIndex;
        var y = d * GAP;
        var dist = Math.abs(d);
        var isNearby = dist <= 2.8;
        var targetOpacity = isNearby ? Math.max(0.12, 1 - dist * 0.42) : 0;
        var targetScale = isNearby ? Math.max(0.85, 1 - dist * 0.05) : 0.85;

        if (idx === activeInspectIndex) {
          gsap.to(card, {
            xPercent: -50,
            yPercent: -50,
            x: 0,
            y: y,
            rotation: 22,
            scale: targetScale,
            width: 360,
            height: 225,
            opacity: targetOpacity,
            duration: 0.68,
            ease: "power3.inOut",
            onComplete: function() {
              card.classList.remove("inspecting");
              gsap.set(allCards, { clearProps: "width,height" });
              isInspectOpen = false;
              isInspectAnimating = false;
              activeInspectIndex = -1;
              if (window.Global && Global.lenis) {
                Global.lenis.start();
              }
              updateWalkScroll();
            }
          });
        } else {
          if (isNearby) {
            card.style.display = "block";
            gsap.to(card, {
              xPercent: -50,
              yPercent: -50,
              x: 0,
              y: y,
              rotation: 22,
              scale: targetScale,
              opacity: targetOpacity,
              duration: 0.68,
              ease: "power3.inOut"
            });
          } else {
            card.style.display = "none";
            card.style.opacity = "0";
          }
        }
      });

      // 5. Side UI fades back in
      if (counter) gsap.to(counter, { opacity: 1, x: 0, duration: 0.55, ease: "power2.out" });
      if (info) gsap.to(info, { opacity: 1, x: 0, duration: 0.55, ease: "power2.out" });

      // 6. Bottom navigation smoothly glides back in
      if (nav) {
        gsap.to(nav, {
          opacity: 1,
          y: 0,
          duration: 0.55,
          ease: "power2.out",
          onStart: function() {
            nav.style.pointerEvents = "auto";
          }
        });
      }
    } else {
      isInspectOpen = false;
      isInspectAnimating = false;
      activeInspectIndex = -1;
      if (window.Global && Global.lenis) {
        Global.lenis.start();
      }
      updateWalkScroll();
    }
  }

  function updateWalkScroll() {
    var track = document.getElementById("conrad-walkalone-track");
    var sticky = document.getElementById("conrad-walkalone-sticky");
    var strip = document.getElementById("walkalone-strip");
    var nav = document.getElementById("walkalone-steps-nav");
    if (!track || !sticky || !strip) return;

    var rect = track.getBoundingClientRect();
    var trackHeight = track.offsetHeight;
    var viewportHeight = window.innerHeight;
    var scrollDistance = trackHeight - viewportHeight;
    if (scrollDistance <= 0) return;

    var progress = Math.max(0, Math.min(1, -rect.top / scrollDistance));
    var numItems = WALK_DATA.length;
    var floatIndex = progress * (numItems - 1);
    var activeStep = Math.max(0, Math.min(numItems - 1, Math.round(floatIndex)));

    // Keep showcase fully visible and active through the track and when resting at the end
    var stripW = 440;
    var sectionOpacity = 1;

    if (rect.top > 0) {
      // Entry from hero: smoothly open two sides from center
      var enterRatio = Math.max(0, Math.min(1, 1 - rect.top / (viewportHeight * 0.75)));
      var openEase = enterRatio * enterRatio * (3 - 2 * enterRatio);
      stripW = Math.max(0, 440 * openEase);
      sectionOpacity = openEase;
    } else {
      // Inside track and reaching bottom: stay fully open and visible on letter T
      stripW = 440;
      sectionOpacity = 1;
    }

    sticky.style.opacity = sectionOpacity.toString();
    sticky.style.visibility = "visible";
    sticky.style.pointerEvents = "auto";

    // When inspection is open, do not disrupt the GSAP inspection animation
    if (!isInspectOpen && !isInspectAnimating) {
      strip.style.width = stripW + "px";
      strip.style.opacity = sectionOpacity.toString();

      // 1. Position and animate cards along slanted track
      var cards = track.querySelectorAll(".walkalone-card-item");
      cards.forEach(function(card, idx) {
        var d = idx - floatIndex;
        var y = d * GAP;
        var isNearby = Math.abs(d) <= 2.8;
        if (isNearby && sectionOpacity > 0.01) {
          card.style.display = "block";
          var distFromCenter = Math.abs(d);
          var opacity = Math.max(0.12, 1 - distFromCenter * 0.42) * sectionOpacity;
          var scale = Math.max(0.85, 1 - distFromCenter * 0.05) * (0.8 + 0.2 * sectionOpacity);
          card.style.transform = "translate(-50%, -50%) translateY(" + y + "px) rotate(" + (-ANGLE) + "deg) scale(" + scale + ")";
          card.style.opacity = opacity;
          card.style.zIndex = 10 - Math.round(distFromCenter);
        } else {
          card.style.display = "none";
          card.style.opacity = "0";
        }
      });

      // 2. Rolling drum letters on the left
      var letters = track.querySelectorAll(".walkalone-letter-item");
      letters.forEach(function(letterEl, idx) {
        var offset = idx - floatIndex;
        if (Math.abs(offset) <= 1.4 && sectionOpacity > 0.01) {
          letterEl.style.display = "flex";
          var dist = Math.abs(offset);
          var opacity = Math.max(0, 1 - dist * 0.72) * sectionOpacity;
          var scale = Math.max(0.72, 1 - dist * 0.2);
          var yPct = offset * 115;
          letterEl.style.transform = "translateY(" + yPct + "%) scale(" + scale + ")";
          letterEl.style.opacity = opacity;
          if (dist < 0.38) {
            letterEl.style.color = "#ffffff";
          } else {
            letterEl.style.color = "rgba(255, 255, 255, 0.28)";
          }
        } else {
          letterEl.style.display = "none";
          letterEl.style.opacity = "0";
        }
      });

      // 3. Right side info
      var infoItems = track.querySelectorAll(".walkalone-info-item");
      infoItems.forEach(function(item, idx) {
        if (idx === activeStep && sectionOpacity > 0.1) {
          item.classList.add("active");
          item.style.opacity = sectionOpacity.toString();
        } else {
          item.classList.remove("active");
          item.style.opacity = "0";
        }
      });
    }

    // 4. Step letters at bottom (DRUNKEAST navigation)
    var stepLetters = track.querySelectorAll(".walkalone-step-letter, .walkalone-step-dot");
    stepLetters.forEach(function(letterEl, idx) {
      if (idx === activeStep) {
        letterEl.classList.add("active");
      } else {
        letterEl.classList.remove("active");
      }
    });

    // 5. Hide floating navigation when scrolled to the bottom (past T towards contact) or above track or when inspecting
    if (nav) {
      var isPastOrEnd = (rect.bottom <= viewportHeight + 60) || (progress >= 0.985);
      if (isPastOrEnd || isInspectOpen) {
        nav.style.opacity = "0";
        nav.style.pointerEvents = "none";
        nav.style.transform = "translateX(-50%) translateY(14px)";
      } else if (rect.top > 0) {
        nav.style.opacity = (Math.max(0, 1 - rect.top / 160) * sectionOpacity).toString();
        nav.style.pointerEvents = "auto";
        nav.style.transform = "translateX(-50%) translateY(0)";
      } else if (!isInspectAnimating) {
        nav.style.opacity = sectionOpacity.toString();
        nav.style.pointerEvents = "auto";
        nav.style.transform = "translateX(-50%) translateY(0)";
      }
    }
  }

  function goToWalkStep(targetStep) {
    var track = document.getElementById("conrad-walkalone-track");
    if (!track) return;
    var targetProgress = targetStep / (WALK_DATA.length - 1);
    var scrollDistance = track.offsetHeight - window.innerHeight;
    var targetScrollTop = track.offsetTop + targetProgress * scrollDistance;
    if (window.Global && Global.lenis) {
      Global.lenis.scrollTo(targetScrollTop);
    } else {
      window.scrollTo({ top: targetScrollTop, behavior: "smooth" });
    }
  }
  window.goToWalkStep = goToWalkStep;

  var eventsBound = false;
  function bindWalkEvents() {
    var track = document.getElementById("conrad-walkalone-track");
    if (!track) return;

    var cards = track.querySelectorAll(".walkalone-card-item");
    cards.forEach(function(card, idx) {
      card.addEventListener("click", function(e) {
        e.preventDefault();
        e.stopPropagation();
        if (isInspectAnimating) return;
        if (isInspectOpen) {
          closeWalkInspect();
        } else {
          openWalkInspect(card, idx);
        }
      });
    });

    // Clicking the sheet, background strip, or sticky container closes inspect
    var sheet = document.getElementById("walkalone-inspect-sheet");
    if (sheet) {
      sheet.addEventListener("click", function(e) {
        if (isInspectOpen && !isInspectAnimating) {
          e.preventDefault();
          e.stopPropagation();
          closeWalkInspect();
        }
      });
    }

    var strip = document.getElementById("walkalone-strip");
    if (strip) {
      strip.addEventListener("click", function(e) {
        if (isInspectOpen && !isInspectAnimating) {
          e.preventDefault();
          e.stopPropagation();
          closeWalkInspect();
        }
      });
    }

    var sticky = document.getElementById("conrad-walkalone-sticky");
    if (sticky) {
      sticky.addEventListener("click", function(e) {
        if (isInspectOpen && !isInspectAnimating) {
          closeWalkInspect();
        }
      });
    }

    // Step letters click navigation
    var stepLetters = track.querySelectorAll(".walkalone-step-letter, .walkalone-step-dot");
    stepLetters.forEach(function(letterEl) {
      letterEl.addEventListener("click", function(e) {
        e.preventDefault();
        if (isInspectOpen) closeWalkInspect();
        var s = parseInt(letterEl.getAttribute("data-step"), 10);
        goToWalkStep(s);
      });
    });

    if (!eventsBound) {
      eventsBound = true;

      // When inspect is open, intercept wheel/trackpad gestures so the page scroll position is frozen:
      // this triggers a smooth closing animation with ZERO jitter and ZERO snap up!
      window.addEventListener("wheel", function(e) {
        if (isInspectOpen) {
          e.preventDefault();
          e.stopPropagation();
          if (!isInspectAnimating) {
            closeWalkInspect();
          }
        } else if (isInspectAnimating) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, { passive: false });

      window.addEventListener("touchmove", function(e) {
        if (isInspectOpen) {
          e.preventDefault();
          e.stopPropagation();
          if (!isInspectAnimating) {
            closeWalkInspect();
          }
        } else if (isInspectAnimating) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, { passive: false });

      if (window.Global && Global.lenis) {
        Global.lenis.on("scroll", function() {
          if (isInspectOpen && !isInspectAnimating) closeWalkInspect();
          updateWalkScroll();
        });
      }
      window.addEventListener("scroll", function() {
        if (isInspectOpen && !isInspectAnimating) closeWalkInspect();
        updateWalkScroll();
      }, { passive: true });

      window.addEventListener("resize", function() {
        if (window.Global && Global.lenis) Global.lenis.resize();
        updateWalkScroll();
      }, { passive: true });

      document.addEventListener("keydown", function(e) {
        if (e.key === "Escape" || e.keyCode === 27) {
          if (isInspectOpen) closeWalkInspect();
        }
      });
    }

    updateWalkScroll();
  }

  function isAboutRoute() {
    var p = window.location.pathname.replace(/\/$/, "") || "/";
    return p === "/about" || p.startsWith("/about/");
  }

  function ensureAboutTrack() {
    var onAbout = isAboutRoute();
    var track = document.getElementById("conrad-walkalone-track");
    var contact = document.getElementById("conrad-contact-block");
    
    // Only mount on the About page
    if (!onAbout) {
      if (track) track.remove();
      if (contact) contact.remove();
      return;
    }

    var hero = document.querySelector(".PageHero");
    if (!hero) return;

    if (!track) {
      var div = document.createElement("div");
      div.id = "conrad-walkalone-track";
      div.innerHTML = generateWalkHTML();
      hero.parentNode.insertBefore(div, hero.nextSibling);

      // Link hero down arrow button to scroll into the track
      var nextBtn = hero.querySelector(".scrollToNext");
      if (nextBtn && !nextBtn._walkBound) {
        nextBtn._walkBound = true;
        nextBtn.addEventListener("click", function(e) {
          e.preventDefault();
          e.stopPropagation();
          var t = document.getElementById("conrad-walkalone-track");
          if (t) {
            var topPos = t.getBoundingClientRect().top + window.pageYOffset;
            if (window.Global && Global.lenis) {
              Global.lenis.scrollTo(topPos);
            } else {
              window.scrollTo({ top: topPos, behavior: "smooth" });
            }
          }
        }, true);
      }

      bindWalkEvents();
      if (window.Global && Global.lenis) {
        Global.lenis.resize();
      }
    } else if (hero.nextSibling !== track) {
      hero.parentNode.insertBefore(track, hero.nextSibling);
    }

    // Mount and manage Contact Us block directly below showcase track and above footer
    var currentTrack = document.getElementById("conrad-walkalone-track");
    if (currentTrack) {
      if (!contact) {
        var contactSec = document.createElement("section");
        contactSec.id = "conrad-contact-block";
        contactSec.className = "conrad-contact-section";
        contactSec.innerHTML = generateContactHTML();
        currentTrack.parentNode.insertBefore(contactSec, currentTrack.nextSibling);
        if (window.Global && Global.lenis) {
          Global.lenis.resize();
        }
      } else if (currentTrack.nextSibling !== contact) {
        currentTrack.parentNode.insertBefore(contact, currentTrack.nextSibling);
      }
    }
  }

  window.ensureAboutTrack = ensureAboutTrack;
  window.addEventListener("conrad-locationchange", ensureAboutTrack);

  var lastAboutRoute = null;
  function checkAboutRoute() {
    var p = window.location.pathname.replace(/\/$/, "") || "/";
    var hero = document.querySelector(".PageHero");
    var track = document.getElementById("conrad-walkalone-track");
    if (p !== lastAboutRoute || (hero && !track)) {
      lastAboutRoute = p;
      ensureAboutTrack();
    }
  }
  window.addEventListener("popstate", checkAboutRoute);
  setInterval(checkAboutRoute, 150);

  if (document.readyState === "complete" || document.readyState === "interactive") {
    ensureAboutTrack();
  } else {
    window.addEventListener("DOMContentLoaded", ensureAboutTrack);
    window.addEventListener("load", ensureAboutTrack);
  }
})();
</script>
